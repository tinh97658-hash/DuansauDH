services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:?Set DB_PORT in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.1
    entrypoint: ["/venv/bin/python3", "/pgadmin4/project-start.py"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/project-servers.json
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${DB_ADMIN_PORT:?Set DB_ADMIN_PORT in .env}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_start
        target: /pgadmin4/project-start.py
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-pgsms-api:local}
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FRONTEND_URL: http://127.0.0.1:${WEB_PORT:-3100}
      API_PUBLIC_URL: http://127.0.0.1:${WEB_PORT:-3100}/api
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    volumes:
      - ./backend/public:/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-pgsms-web:local}
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:8080"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped

configs:
  pgadmin_start:
    file: ./backend/database/pgadmin/start.py

volumes:
  postgres_data:
    name: duansaudh_postgres_data
  pgadmin_data:
